    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {

      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card-container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 32px;
      padding: 24px 20px 22px 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.06);
      text-align: center;
      border: 1px solid #ebebeb;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    
    .brand-tag {
      font-size: 11px;
      letter-spacing: 3px;
      color: #bbb;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* 多國語言切換列 */
    .lang-switcher {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .lang-btn {
      border: 1px solid #e2e4e8;
      background: #ffffff;
      color: #777;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }

    /* 模式切換標籤頁 */
    .mode-tabs {
      display: flex;
      gap: 6px;
      background: #f0f1f4;
      padding: 4px;
      border-radius: 20px;
      margin-bottom: 14px;
    }
    .mode-tab {
      border: none;
      background: transparent;
      font-size: 12.5px;
      font-weight: 600;
      color: #777;
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-tab.active {
      background: #ffffff;
      color: #111;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* 主時間顯示：56px 大字 */
    .clock-display {
      font-family: "Courier New", Courier, monospace, sans-serif;
      font-size: 56px;
      font-weight: 800;
      color: #111111;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 10px;
    }

    /* 控制面板 */
    .control-panel {
      display: none;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .panel-btn {
      background: #111;
      color: #fff;
      border: none;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.15s;
    }
    .panel-btn.secondary {
      background: #f0f1f4;
      color: #555;
      border: 1px solid #e0e2e6;
    }
    .panel-btn:active {
      transform: scale(0.96);
    }
    .alarm-input {
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      font-weight: 700;
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      background: #fafafa;
    }

    /* 自選音樂標籤 */
    .audio-upload-label {
      font-size: 11px;
      color: #888;
      background: #f0f1f4;
      padding: 3px 10px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 8px;
      border: 1px dashed #ccc;
    }
    .audio-upload-label:hover {
      background: #e8eaed;
      color: #333;
    }

    /* 小比圖片區域 */
    .image-box {
      width: 240px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
    .xiaobi-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }
    .xiaobi-img:active {
      transform: scale(0.95);
    }

    .quote-box {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      padding: 0 10px;
    }
    .quote-text {
      font-size: 15px;
      font-weight: 700;
      color: #333333;
      line-height: 1.45;
    }

    .action-btn {
      background: #f0f1f4;
      color: #666666;
      border: 1px solid #e2e4e8;
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: #e6e8ec;
      color: #222222;
    }
    .action-btn:active {
      transform: scale(0.96);
      background: #dadde2;
    }

        document.getElementById('audioLabel').innerText = t.audioLabel;
      }
      document.getElementById('drawBtn').innerText = t.drawBtn;

      // 更新語言選單外觀
      const btns = document.querySelectorAll('.lang-btn');
      const langKeys = ['zh', 'en', 'ja', 'de', 'fr'];
      btns.forEach((btn, idx) => {
        if (langKeys[idx] === lang) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      localStorage.setItem('xiaobi_clock_lang', lang);
      drawCard(); // 切換語言時同步刷新卡牌台詞
    }

    // === 音效系統 ===
    let customAudioUrl = null;
    let audioCtx = null;

    function ensureAudioUnlocked() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('click', ensureAudioUnlocked, { once: false });

    function handleAudioUpload(event) {
      const file = event.target.files[0];
      if (file) {
        customAudioUrl = URL.createObjectURL(file);
        document.getElementById('customAudio').src = customAudioUrl;
        document.getElementById('audioLabel').innerText = uiTexts[currentLang].audioCustom;
      }
    }

    function playDefaultBeep() {
      function playTone(freq, duration, delay) {
        setTimeout(() => {
          try {
            ensureAudioUnlocked();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
          } catch(e) {}
        }, delay);
      }
      playTone(880, 0.15, 0);
      playTone(880, 0.15, 200);
      playTone(880, 0.15, 400);
      playTone(1174, 0.35, 600);
    }

    function playBeep() {
      if (customAudioUrl) {
        const aud = document.getElementById('customAudio');
        aud.currentTime = 0;
        aud.play().catch(() => playDefaultBeep());
      } else {
        playDefaultBeep();
      }
    }

    // === 模式切換 ===
    let currentMode = 'clock';

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      const tabs = document.querySelectorAll('.mode-tab');
      if (mode === 'clock') tabs[0].classList.add('active');
      if (mode === 'pomo') tabs[1].classList.add('active');
      if (mode === 'alarm') tabs[2].classList.add('active');

      document.getElementById('pomoControls').style.display = (mode === 'pomo') ? 'flex' : 'none';
      document.getElementById('alarmControls').style.display = (mode === 'alarm') ? 'flex' : 'none';

      if (mode === 'clock') updateClock();
      if (mode === 'pomo') renderPomoDisplay();
      if (mode === 'alarm') updateClock();
    }

    // === 時鐘與鬧鐘 ===
    let alarmTime = null;
    let alarmTriggered = false;

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const timeStr = `${h}:${m}:${s}`;

      if (currentMode === 'clock' || currentMode === 'alarm') {
        document.getElementById('mainDisplay').innerText = timeStr;
      }

      const currentHM = `${h}:${m}`;
      if (alarmTime && currentHM === alarmTime && !alarmTriggered) {
        alarmTriggered = true;
        playBeep();
        triggerAlarmAlert();
      }
      if (alarmTime && currentHM !== alarmTime) {
        alarmTriggered = false;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    function toggleAlarm() {
      const input = document.getElementById('alarmTimeInput');
      const btn = document.getElementById('alarmSetBtn');
      const t = uiTexts[currentLang];
      if (!alarmTime) {
        if (!input.value) return;
        alarmTime = input.value;
        btn.innerText = `${t.alarmCancel} (${alarmTime})`;
        btn.classList.add('secondary');
      } else {
        alarmTime = null;
        btn.innerText = t.alarmSet;
        btn.classList.remove('secondary');
      }
    }

    function triggerAlarmAlert() {
      document.getElementById('cardImage').src = "images/xiaobi-15.png";
      document.getElementById('quoteText').innerText = uiTexts[currentLang].alarmAlert;
    }

    // === 番茄鐘 ===
    let pomoSeconds = 25 * 60;
    let pomoTimer = null;
    let isPomoRunning = false;

    function renderPomoDisplay() {
      const m = String(Math.floor(pomoSeconds / 60)).padStart(2, '0');
      const s = String(pomoSeconds % 60).padStart(2, '0');
      document.getElementById('mainDisplay').innerText = `${m}:${s}`;
    }

    function togglePomo() {
      const btn = document.getElementById('pomoBtn');
      const t = uiTexts[currentLang];
      if (isPomoRunning) {
        clearInterval(pomoTimer);
        isPomoRunning = false;
        btn.innerText = t.pomoResume;
      } else {
        isPomoRunning = true;
        btn.innerText = t.pomoPause;
        pomoTimer = setInterval(() => {
          if (pomoSeconds > 0) {
            pomoSeconds--;
            renderPomoDisplay();
          } else {
            clearInterval(pomoTimer);
            isPomoRunning = false;
            btn.innerText = t.pomoStart;
            playBeep();
            document.getElementById('cardImage').src = "images/xiaobi-02.png";
            document.getElementById('quoteText').innerText = t.pomoAlert;
          }
        }, 1000);
      }
    }

    function resetPomo(mins) {
      clearInterval(pomoTimer);
      isPomoRunning = false;
      pomoSeconds = mins * 60;
      const t = uiTexts[currentLang];
      document.getElementById('pomoBtn').innerText = (mins === 25) ? t.pomoStart : t.pomoRest;
      renderPomoDisplay();
    }

    // === 抽卡與金句生成（支援語言同步） ===
    let lastQuote = "";

    function drawCard() {
      let chosenImg = "";
      let chosenText = "";

      const pool = lyingQuotes[currentLang] || lyingQuotes.zh;

      if (Math.random() < 0.65) {
        chosenImg = lyingImages[Math.floor(Math.random() * lyingImages.length)];
        do {
          chosenText = pool[Math.floor(Math.random() * pool.length)];
        } while (chosenText === lastQuote && pool.length > 1);
      } else {
        const special = specialCards[Math.floor(Math.random() * specialCards.length)];
        chosenImg = special.img;
        chosenText = special[currentLang] || special.zh;
      }

      lastQuote = chosenText;

      const imgElement = document.getElementById("cardImage");
      imgElement.style.opacity = '0.3';
      setTimeout(() => {
        imgElement.src = chosenImg;
        document.getElementById("quoteText").innerText = chosenText;
        imgElement.style.opacity = '1';
      }, 150);
    }

    const AUTO_CHANGE_INTERVAL = 10000;
    let timer = setInterval(drawCard, AUTO_CHANGE_INTERVAL);

    function manualDraw() {
      clearInterval(timer);
      drawCard();
      timer = setInterval(drawCard, AUTO_CHANGE_INTERVAL);
    }

    window.onload = () => {
      // 讀取 portal 入口頁面共享的語言設定或時鐘本地記憶
      const savedLang = localStorage.getItem('xiaobi_clock_lang') || localStorage.getItem('xiaobi_lang') || 'zh';
      setLang(savedLang);
    };
  </script>
</body>
